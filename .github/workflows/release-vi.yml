name: release-vi

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Phiên bản, ví dụ v0.1.0-vi"
        required: true
        default: "v0.1.0-vi"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Build all binaries
        working-directory: packages/opencode
        run: bun run build

      - name: Package binaries
        run: |
          cd packages/opencode/dist
          for d in */; do
            n="${d%/}"
            zip -r "${n}.zip" "$n"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: OpenCode Việt ${{ inputs.version }}
          body: "Bản việt hóa opencode — tải file opencode-<hệ điều hành>-<kiến trúc>.zip tương ứng."
          files: |
            packages/opencode/dist/*.zip
          generate_release_notes: true
